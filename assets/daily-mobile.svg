<svg xmlns="http://www.w3.org/2000/svg" width="460" height="318" viewBox="0 0 460 318"><title>Daily back-end challenge</title><rect width="460" height="318" rx="5" fill="#1d292d"/><text x="20" y="37" font-family="monospace" font-size="14" font-weight="400" fill="#ccfa85">DAILY BACK-END CHALLENGE</text><text x="20" y="68" font-family="monospace" font-size="14" font-weight="400" fill="#aebbc4">27 Nov 2026  /  Retry budget</text><text x="20" y="108" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#f3f0e6">With a retry limit of zero, what</text><text x="20" y="134" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#f3f0e6">does this function return?</text><rect x="20" y="155" width="420" height="139" rx="5" fill="#121921" stroke="#40505a"/><text x="37" y="180" font-family="monospace" font-size="14" font-weight="400" fill="#c5d2da">challenge.js</text><path d="M20 191h420" stroke="#34414d"/><text x="30" y="213" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">1</text><text x="59" y="213" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace"><tspan fill="#baafff">function</tspan> retryLimit(value) {</text><text x="30" y="234" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">2</text><text x="59" y="234" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  <tspan fill="#baafff">return</tspan> value || <tspan fill="#fdc99c">3</tspan>;</text><text x="30" y="255" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">3</text><text x="59" y="255" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">}</text><text x="30" y="276" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">4</text><text x="59" y="276" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">console.log(retryLimit(<tspan fill="#fdc99c">0</tspan>));</text></svg>
