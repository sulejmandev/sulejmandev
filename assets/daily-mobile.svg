<svg xmlns="http://www.w3.org/2000/svg" width="460" height="465" viewBox="0 0 460 465"><title>Daily back-end challenge</title><rect width="460" height="465" rx="5" fill="#1d292d"/><text x="20" y="37" font-family="monospace" font-size="14" font-weight="400" fill="#ccfa85">DAILY BACK-END CHALLENGE</text><text x="20" y="68" font-family="monospace" font-size="14" font-weight="400" fill="#aebbc4">26 Nov 2026  /  Caching zero</text><text x="20" y="108" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#f3f0e6">How many times does this function</text><text x="20" y="134" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#f3f0e6">read the stock?</text><rect x="20" y="155" width="420" height="286" rx="5" fill="#121921" stroke="#40505a"/><text x="37" y="180" font-family="monospace" font-size="14" font-weight="400" fill="#c5d2da">challenge.js</text><path d="M20 191h420" stroke="#34414d"/><text x="30" y="213" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">1</text><text x="59" y="213" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace"><tspan fill="#baafff">const</tspan> cache = <tspan fill="#baafff">new</tspan> Map();</text><text x="30" y="234" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">2</text><text x="59" y="234" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace"><tspan fill="#baafff">let</tspan> reads = <tspan fill="#fdc99c">0</tspan>;</text><text x="30" y="255" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">3</text><text x="59" y="255" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace"><tspan fill="#baafff">function</tspan> stock(sku) {</text><text x="30" y="276" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">4</text><text x="59" y="276" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  <tspan fill="#baafff">if</tspan> (cache.get(sku)) <tspan fill="#baafff">return</tspan> </text><text x="30" y="297" font-family="monospace" font-size="12" font-weight="400" fill="#82909e"></text><text x="59" y="297" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">cache.get(sku);</text><text x="30" y="318" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">5</text><text x="59" y="318" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  reads++;</text><text x="30" y="339" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">6</text><text x="59" y="339" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  cache.set(sku, <tspan fill="#fdc99c">0</tspan>);</text><text x="30" y="360" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">7</text><text x="59" y="360" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  <tspan fill="#baafff">return</tspan> <tspan fill="#fdc99c">0</tspan>;</text><text x="30" y="381" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">8</text><text x="59" y="381" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">}</text><text x="30" y="402" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">9</text><text x="59" y="402" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">stock(<tspan fill="#d2f59b">&quot;A&quot;</tspan>); stock(<tspan fill="#d2f59b">&quot;A&quot;</tspan>);</text><text x="30" y="423" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">10</text><text x="59" y="423" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">console.log(reads);</text></svg>
