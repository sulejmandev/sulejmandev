<svg xmlns="http://www.w3.org/2000/svg" width="960" height="237" viewBox="0 0 960 237"><title>Daily back-end challenge</title><rect width="960" height="237" rx="5" fill="#1d292d"/><text x="28" y="37" font-family="monospace" font-size="14" font-weight="400" fill="#ccfa85">DAILY BACK-END CHALLENGE</text><text x="28" y="68" font-family="monospace" font-size="14" font-weight="400" fill="#aebbc4">28 Nov 2026  /  Async filtering</text><text x="28" y="108" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f3f0e6">Only job 2 is ready.</text><text x="28" y="134" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f3f0e6">Which IDs does this</text><text x="28" y="160" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f3f0e6">return?</text><rect x="393" y="26" width="539" height="139" rx="5" fill="#121921" stroke="#40505a"/><text x="410" y="51" font-family="monospace" font-size="14" font-weight="400" fill="#c5d2da">challenge.js</text><path d="M393 62h539" stroke="#34414d"/><text x="403" y="84" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">1</text><text x="432" y="84" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace"><tspan fill="#baafff">function</tspan> readyJobs(ids) {</text><text x="403" y="105" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">2</text><text x="432" y="105" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  <tspan fill="#baafff">return</tspan> ids.filter(<tspan fill="#baafff">async</tspan> id =&gt; id === <tspan fill="#fdc99c">2</tspan>);</text><text x="403" y="126" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">3</text><text x="432" y="126" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">}</text><text x="403" y="147" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">4</text><text x="432" y="147" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">console.log(readyJobs([<tspan fill="#fdc99c">1</tspan>, <tspan fill="#fdc99c">2</tspan>]).join(<tspan fill="#d2f59b">&quot;,&quot;</tspan>));</text></svg>
