<svg xmlns="http://www.w3.org/2000/svg" width="960" height="315" viewBox="0 0 960 315"><title>Daily back-end challenge</title><rect width="960" height="315" rx="5" fill="#1d292d"/><text x="28" y="37" font-family="monospace" font-size="14" font-weight="400" fill="#ccfa85">DAILY BACK-END CHALLENGE</text><text x="28" y="68" font-family="monospace" font-size="14" font-weight="400" fill="#aebbc4">26 Nov 2026  /  Caching zero</text><text x="28" y="108" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f3f0e6">How many times does this</text><text x="28" y="134" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#f3f0e6">function read the stock?</text><rect x="393" y="26" width="539" height="265" rx="5" fill="#121921" stroke="#40505a"/><text x="410" y="51" font-family="monospace" font-size="14" font-weight="400" fill="#c5d2da">challenge.js</text><path d="M393 62h539" stroke="#34414d"/><text x="403" y="84" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">1</text><text x="432" y="84" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace"><tspan fill="#baafff">const</tspan> cache = <tspan fill="#baafff">new</tspan> Map();</text><text x="403" y="105" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">2</text><text x="432" y="105" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace"><tspan fill="#baafff">let</tspan> reads = <tspan fill="#fdc99c">0</tspan>;</text><text x="403" y="126" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">3</text><text x="432" y="126" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace"><tspan fill="#baafff">function</tspan> stock(sku) {</text><text x="403" y="147" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">4</text><text x="432" y="147" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  <tspan fill="#baafff">if</tspan> (cache.get(sku)) <tspan fill="#baafff">return</tspan> cache.get(sku);</text><text x="403" y="168" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">5</text><text x="432" y="168" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  reads++;</text><text x="403" y="189" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">6</text><text x="432" y="189" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  cache.set(sku, <tspan fill="#fdc99c">0</tspan>);</text><text x="403" y="210" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">7</text><text x="432" y="210" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">  <tspan fill="#baafff">return</tspan> <tspan fill="#fdc99c">0</tspan>;</text><text x="403" y="231" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">8</text><text x="432" y="231" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">}</text><text x="403" y="252" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">9</text><text x="432" y="252" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">stock(<tspan fill="#d2f59b">&quot;A&quot;</tspan>); stock(<tspan fill="#d2f59b">&quot;A&quot;</tspan>);</text><text x="403" y="273" font-family="monospace" font-size="12" font-weight="400" fill="#82909e">10</text><text x="432" y="273" xml:space="preserve" fill="#e1e6f1" font-size="15" font-family="monospace">console.log(reads);</text></svg>
